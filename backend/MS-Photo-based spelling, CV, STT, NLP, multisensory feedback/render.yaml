services:
  - type: web
    name: photo-spelling-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: dyslearnapp
      - key: MODEL_PATH
        value: best_yolov8_openimages_plus_roboflow_v2-3.pt
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: PYTHON_VERSION
        value: "3.11.11"
