services:
  - type: web
    name: multi-skill-learning-game-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard
      - key: DB_NAME
        value: dyslexia
      - key: MODEL_PATH
        value: dyslexia_stage_model.pkl
      - key: SCALER_PATH
        value: feature_scaler.pkl
      - key: FEAT_PATH
        value: feature_cols.json
      - key: PYTHON_VERSION
        value: "3.11.6"
    healthCheckPath: /health
    autoDeploy: true
